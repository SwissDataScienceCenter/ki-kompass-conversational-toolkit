[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ki_kompass_rag"
description = "KI-Kompass RAG workshop pipeline and chat app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "conversational-toolkit",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "partial-json-parser>=0.2.1.1.post7",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]
dynamic = ["version"]

[tool.uv.sources]
conversational-toolkit = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ki_kompass_rag.__version__" }
