name: Run tests

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LOCKED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - run: uv sync

    - run: uv run ruff format --check

    - run: uv run ruff check

    - run: uv run pytest -v
