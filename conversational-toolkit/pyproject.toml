[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational_toolkit"
authors = []
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.150.1",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "markitdown[pdf]>=0.1.9",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "openai>=2.21.0,<3",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pgvector>=0.4.2",
    "pillow>=10.4",
    "pydantic>=2.14.3",
    "python-jose>=3.4.0",
    "qwen-vl-utils==0.0.14",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "SQLAlchemy>=2.0.46",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "conversational_toolkit.__version__" }

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py310"
line-length = 120
fix = true


[tool.ruff.lint]
extend-select = [
    "W605", # pycodestyle: invalid-escape-sequence
    "S102", # flake8-bandit: exec-builtin
    "INP", # flake8-no-pep420
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = [
    "NPY002", # numpy-legacy-random
    "PGH003", # type ignore for mypy
    "PLR0913", # too many arguments (common in class __init__ signatures)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]
"[!t][!e][!s][!t][!s]*/**" = ["PT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
exclude = "^(venv|examples)/"
