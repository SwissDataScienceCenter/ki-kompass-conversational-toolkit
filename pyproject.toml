[project]
name = "ki-kompass"
version = "0.1.0"
description = "KI-Kompass conversational toolkit and RAG workshop notebooks"
requires-python = ">=3.12"
dependencies = [
    "conversational-toolkit",
    "ki-kompass-rag",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "jupyterlab>=4.6.6",
    "langchain-openai>=1.0",
    "pre-commit>=4.0",
    "pytest>=8.4.1",
    "python-dotenv>=1.0",
    "ruff>=0.12.3,<0.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["conversational-toolkit", "backend"]

[tool.uv.sources]
conversational-toolkit = { workspace = true }
ki-kompass-rag = { workspace = true }

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "W605", # pycodestyle: invalid-escape-sequence
    "PGH",  # pygrep-hooks
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PGH003", # allow blanket type: ignore comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
